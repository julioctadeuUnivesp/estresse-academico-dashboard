[theme]
base="dark"

[main-header]
font-size = "2.5rem"
color = "#1f77b4"
text-align = "center"
margin-bottom = "2rem"

[metric-card]
background-color = "#f0f2f6"
padding = "1rem"
border-radius = "10px"
border-left = "4px solid #1f77b4"

[positive]
color = "#2ecc71"

[negative]
color = "#e74c3c"

[neutral]
color = "#f39c12"

